plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeyProperties = new Properties()
def releaseKeyPropertiesFile = rootProject.file("key.properties")
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyProperties.load(new FileInputStream(releaseKeyPropertiesFile))
}
def requiredReleaseProperties = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
def hasReleaseSigning = releaseKeyPropertiesFile.exists() &&
        requiredReleaseProperties.every { releaseKeyProperties.getProperty(it) }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

android {
    namespace = "com.just2alim.musico"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.just2alim.musico"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            MAPS_API_KEY: System.getenv("GOOGLE_MAPS_API_KEY") ?: ""
        ]
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = releaseKeyProperties["keyAlias"]
                keyPassword = releaseKeyProperties["keyPassword"]
                storeFile = file(releaseKeyProperties["storeFile"])
                storePassword = releaseKeyProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (!hasReleaseSigning && releaseTaskRequested) {
                throw new GradleException(
                    "Configure android/key.properties with a private upload keystore before creating a release build."
                )
            }
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter {
    source = "../.."
}
